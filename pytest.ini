[pytest]
pythonpath = .
filterwarnings =
    # numpy >=2.5 deprecated the implicit "generic" unit fallback used
    # internally by pandas 2.3.3's own Timestamp/Timedelta/DatetimeIndex
    # arithmetic (see numpy 2.5.0 release notes, gh-28287). It fires from
    # completely idiomatic pandas code (Timestamp + Timedelta, df.resample,
    # etc.) and from inside pandas' own internals (concat.py, resample.py),
    # not from a bug in this codebase. pandas 3.0's datetime/timedelta
    # resolution-inference rework likely eliminates it, but that's a major
    # version bump warranting its own deliberate upgrade + regression pass,
    # not something to force here. Scoped ignore, exact message only, so
    # any other future warning still surfaces normally.
    ignore:The 'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning
